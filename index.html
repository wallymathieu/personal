<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wallymathieu</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fa;
      --surface: #ffffff;
      --text: #1f2328;
      --muted: #57606a;
      --border: #d0d7de;
      --accent: #0969da;
      --accent-hover: #0860ca;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(720px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: clamp(20px, 5vw, 40px);
      box-shadow: 0 1px 2px rgba(31, 35, 40, 0.08);
    }

    .badge {
      display: inline-block;
      margin-bottom: 12px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #f6f8fa;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      max-width: 54ch;
    }

    .actions {
      margin-top: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .button {
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 9px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      color: var(--text);
      background: var(--surface);
    }

    .button.primary {
      color: #ffffff;
      background: var(--accent);
      border-color: rgba(27, 31, 36, 0.15);
    }

    .button.primary:hover {
      background: var(--accent-hover);
    }

    .button:hover {
      background: #f3f4f6;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <span class="badge">Welcome</span>
      <h1>Hi, I’m wallymathieu.</h1>
      <p>
        Building practical software with clean architecture, thoughtful UX, and a focus on maintainable code.
      </p>
      <div class="actions">
        <a class="button primary" href="https://github.com/wallymathieu">View GitHub</a>
        <a class="button" href="mailto:hello@wallymathieu.dev">Contact</a>
      </div>
    </section>
  </main>
</body>
</html>
